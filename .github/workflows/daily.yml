name: Daily Short

on:
  schedule:
    - cron: "30 11 * * *"   # roz 5:00 PM IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = sirf test video banao, 0 = asli run"
        default: "1"

permissions:
  contents: write

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and Hindi font
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y ffmpeg libraqm0 libfribidi0 fonts-noto-core && break
            echo "apt retry $i"; sleep 20
          done
          mkdir -p fonts
          curl -fL --retry 3 -o fonts/Mukta-Bold.ttf "https://github.com/google/fonts/raw/main/ofl/mukta/Mukta-Bold.ttf" || true

      - name: Install python packages
        run: |
          for i in 1 2 3; do
            pip install -U -r requirements.txt && break
            echo "pip retry $i"; sleep 20
          done

      - name: Make Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python main.py

      - name: Send to Make (optional)
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: python notify_make.py

      - name: Save video for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: out/
          retention-days: 14
          if-no-files-found: ignore

      - name: Save history
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "update history" && (git push || (git pull --rebase && git push)))
